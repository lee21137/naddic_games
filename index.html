<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 포털 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #fafafa; }
        .overflow-hidden { overflow: hidden; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex flex-col h-screen overflow-hidden">

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white z-50 transform -translate-x-full transition-transform duration-300 border-r border-gray-200 shadow-xl flex flex-col">
        <div class="h-16 px-6 border-b border-gray-100 flex justify-between items-center">
            <span class="font-bold text-gray-900">메뉴</span>
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <nav class="flex-1 p-4 overflow-y-auto space-y-1" id="menuNav">
            <a href="#" data-page="welcome.html" onclick="loadPage('welcome.html', this); return false;" class="menu-link block px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                🏠 인덱스 소개
            </a>
            
            <div class="pt-6 pb-2 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">프로그램 목록</div>
            
            <!-- 상대 경로 사용 (슬래시 제거) -->
            <a href="#" data-page="redmine/index.html" onclick="loadPage('redmine/index.html', this); return false;" class="menu-link block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                1. 레드마인
            </a>
            <a href="#" data-page="program1/index.html" onclick="loadPage('program1/index.html', this); return false;" class="menu-link block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                2. 기타프로그램1
            </a>
            <a href="#" data-page="program2/index.html" onclick="loadPage('program2/index.html', this); return false;" class="menu-link block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                3. 기타프로그램2
            </a>
        </nav>
    </aside>

    <nav class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-gray-200 h-16 flex items-center shrink-0">
        <div class="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-900 p-1 rounded-md hover:bg-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div class="text-lg font-bold text-gray-900 hover:text-blue-600 cursor-pointer" onclick="loadPage('welcome.html', document.querySelector('.menu-link[data-page=\'welcome.html\']')); return false;">
                    <span class="text-blue-600">🔔</span> 프로그램 포털
                </div>
            </div>
            <div class="text-sm font-medium text-gray-500">통합 버전 관리 허브</div>
        </div>
    </nav>

    <main class="flex-1 overflow-hidden bg-gray-50">
        <iframe id="contentFrame" name="contentFrame" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                document.body.classList.add('overflow-hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                document.body.classList.remove('overflow-hidden');
            }
        }

        function loadPage(pageName, element) {
            // [핵심 포인트] 넘어온 경로 맨 앞에 '/'가 있다면 무조건 제거 (상대경로로 변환)
            if (pageName.startsWith('/')) {
                pageName = pageName.substring(1);
            }

            const newUrl = window.location.pathname + '?page=' + pageName;
            window.history.pushState({path: newUrl}, '', newUrl);
            
            handleRoute();

            if (!document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function setActiveMenu(element) {
            document.querySelectorAll('.menu-link').forEach(link => {
                link.classList.remove('text-gray-900', 'bg-gray-100', 'font-semibold');
                link.classList.add('text-gray-600', 'hover:bg-gray-50', 'hover:text-gray-900');
            });
            if (element) {
                element.classList.remove('text-gray-600', 'hover:bg-gray-50', 'hover:text-gray-900');
                element.classList.add('text-gray-900', 'bg-gray-100', 'font-semibold');
            }
        }

        function handleRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            let page = urlParams.get('page') || 'welcome.html';
            
            // [핵심 포인트] URL 주소창에 이미 '/redmine/index.html' 형태로 입력되어 있어도 자동으로 '/'를 제거
            if (page.startsWith('/')) {
                page = page.substring(1);
            }
            
            // iframe에 경로 주입 (이제 무조건 상대경로로 들어감)
            document.getElementById('contentFrame').src = page;
            
            // 메뉴 활성화 매칭 (data-page 속성값과 비교)
            let targetLink = document.querySelector(`.menu-link[data-page="${page}"]`);
            
            // 만약 data-page="/redmine/index.html" 처럼 슬래시가 포함된 태그가 남아있을 경우를 대비한 예외처리
            if (!targetLink) {
                targetLink = document.querySelector(`.menu-link[data-page="/${page}"]`);
            }

            if (targetLink) {
                setActiveMenu(targetLink);
            } else {
                setActiveMenu(document.querySelector(`.menu-link[data-page="welcome.html"]`));
            }
        }

        window.addEventListener('popstate', handleRoute);
        window.addEventListener('DOMContentLoaded', handleRoute);
    </script>
</body>
</html>
